<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Card Game - Prototype</title>
<style>
  :root {
    --bg: #1a1a2e; --panel: #16213e; --accent: #e94560; --gold: #f5c518;
    --text: #eee; --muted: #8899aa;
    --attack: #e94560; --defense: #4e9af1; --heavy: #f39c12; --counter: #9b59b6; --green: #2ecc71;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px;
  }
  h1 { font-size:1.4rem; color:var(--gold); margin-bottom:2px; }
  .subtitle { color:var(--muted); font-size:0.8rem; margin-bottom:12px; }

  /* ---- Game Over Banner ---- */
  .game-over-banner {
    width:100%; max-width:700px; padding:16px 24px; border-radius:10px;
    text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:12px;
  }
  .banner-win { background:var(--green); color:#fff; }
  .banner-draw { background:var(--gold); color:#1a1a2e; }
  .banner-sub { font-size:0.9rem; font-weight:400; margin-top:4px; }

  /* ---- Player Status Bar ---- */
  .status-bar {
    width:100%; max-width:700px; display:flex; gap:16px; margin-bottom:12px;
  }
  .status-player {
    flex:1; background:var(--panel); border-radius:10px; padding:12px 16px;
    border:2px solid transparent; transition:border-color 0.3s;
  }
  .status-player.current { border-color:var(--gold); }
  .status-player.winner { border-color:var(--green); }
  .status-player.loser { border-color:var(--accent); opacity:0.6; }
  .status-name { font-size:0.9rem; font-weight:700; margin-bottom:4px; }
  .status-hp { font-size:1.1rem; }
  .status-hp .hearts { letter-spacing:2px; }

  /* ---- History ---- */
  .status-history { margin-top:6px; display:flex; gap:3px; flex-wrap:wrap; }
  .hist-chip {
    font-size:0.65rem; padding:2px 6px; border-radius:8px; font-weight:600;
  }
  .chip-attack { background:var(--attack); color:#fff; }
  .chip-defense { background:var(--defense); color:#fff; }
  .chip-heavy { background:var(--heavy); color:#1a1a2e; }
  .chip-counter { background:var(--counter); color:#fff; }

  /* ---- Hand Area ---- */
  .hand-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:10px;
    padding:16px; margin-bottom:12px;
  }
  .hand-title {
    font-size:0.85rem; font-weight:700; color:var(--gold); margin-bottom:10px;
    text-align:center;
  }
  .card-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .card-btn {
    width:80px; height:110px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; font-weight:700; font-size:0.85rem; transition:all 0.2s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .card-btn:hover:not(:disabled) { transform:translateY(-4px); box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  .card-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .card-btn.selected { border-color:var(--gold); box-shadow:0 0 16px rgba(245,197,24,0.5); }
  .card-btn .icon { font-size:1.8rem; }
  .card-btn .count { font-size:0.7rem; color:rgba(255,255,255,0.6); }
  .card-attack { background:var(--attack); color:#fff; }
  .card-defense { background:var(--defense); color:#fff; }
  .card-heavy { background:var(--heavy); color:#1a1a2e; }
  .card-counter { background:var(--counter); color:#fff; }

  /* ---- Opponent Hand (Hidden) ---- */
  .opp-hand-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:10px;
    padding:16px; margin-bottom:12px; opacity:0.5;
  }
  .opp-hand-title { font-size:0.8rem; color:var(--muted); text-align:center; margin-bottom:8px; }
  .opp-card-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .opp-card-back {
    width:80px; height:110px; border-radius:10px; background:#2c3e50;
    display:flex; align-items:center; justify-content:center; font-size:2rem;
    border:2px dashed #444;
  }

  /* ---- Round Result Panel ---- */
  .result-panel {
    width:100%; max-width:700px; background:var(--panel); border-radius:12px;
    padding:20px; margin-bottom:12px; border:2px solid var(--gold);
  }
  .result-title { text-align:center; font-size:1rem; color:var(--gold); margin-bottom:12px; }
  .result-cards { display:flex; gap:24px; justify-content:center; align-items:center; margin-bottom:12px; }
  .result-card {
    width:90px; height:120px; border-radius:10px; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    font-weight:700; font-size:0.9rem;
  }
  .result-vs { font-size:1.3rem; color:var(--gold); font-weight:700; }
  .result-details { font-size:0.85rem; text-align:center; line-height:1.6; margin-bottom:12px; }
  .res-dmg { color:var(--accent); font-weight:700; }
  .res-safe { color:var(--green); }
  .res-hp { color:var(--muted); font-size:0.8rem; margin-top:4px; }

  /* ---- Pass Screen ---- */
  .pass-screen {
    width:100%; max-width:700px; background:var(--panel); border-radius:12px;
    padding:32px; text-align:center; margin-bottom:12px; border:2px solid var(--gold);
  }
  .pass-text { font-size:1.1rem; margin-bottom:16px; }
  .pass-hint { font-size:0.8rem; color:var(--muted); margin-top:8px; }

  /* ---- Buttons ---- */
  .btn-row { margin-bottom:12px; display:flex; gap:10px; justify-content:center; }
  .btn {
    padding:10px 28px; border-radius:8px; border:none; cursor:pointer;
    font-weight:700; font-size:0.9rem; transition:all 0.2s;
  }
  .btn-primary { background:var(--gold); color:#1a1a2e; }
  .btn-primary:hover { background:#e0b010; }
  .btn-secondary { background:#334; color:var(--text); }
  .btn-secondary:hover { background:#445; }
  .btn-big { padding:14px 40px; font-size:1.05rem; }

  /* ---- Round Log ---- */
  .log-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:8px;
    padding:10px 16px; max-height:180px; overflow-y:auto;
  }
  .log-area h3 { font-size:0.8rem; color:var(--muted); margin-bottom:6px; }
  .log-entry { font-size:0.8rem; padding:3px 0; border-bottom:1px solid #2a2a4a; }
  .log-entry:last-child { border-bottom:none; }
  .log-dmg { color:var(--accent); }
  .log-safe { color:var(--green); }
</style>
</head>
<body>

<h1>⚔️ Custom Card Game</h1>
<div class="subtitle">Hot-seat — pass the device between players</div>

<div id="gameOverBanner"></div>
<div class="status-bar" id="statusBar"></div>
<div id="handSection"></div>
<div id="actionSection"></div>
<div class="log-area"><h3>📜 Round Log</h3><div id="logContent"><span style="color:var(--muted)">Game started. Each player has 3 HP and 7 cards.</span></div></div>

<script>
const C = { ATTACK:'attack', DEFENSE:'defense', HEAVY:'heavy', COUNTER:'counter' };
const CN = { attack:'Attack', defense:'Defense', heavy:'Heavy Strike', counter:'Counter' };
const CI = { attack:'⚔️', defense:'🛡️', heavy:'💥', counter:'↩️' };
const ORDER = [C.ATTACK, C.DEFENSE, C.HEAVY, C.COUNTER];

let G = {};

function fresh() {
  return {
    players: {
      A: { hp:3, hand:[C.ATTACK,C.ATTACK,C.ATTACK, C.DEFENSE,C.DEFENSE, C.HEAVY, C.COUNTER], history:[] },
      B: { hp:3, hand:[C.ATTACK,C.ATTACK,C.ATTACK, C.DEFENSE,C.DEFENSE, C.HEAVY, C.COUNTER], history:[] }
    },
    round:1, maxRounds:7,
    currentPlayer:'A',
    phase:'select', // select | pass | reveal | gameover
    selection:null,
    opponentSelection:null,
    lastResult:null,
    winner:null,
    logs:[]
  };
}

function countInHand(hand, card) { return hand.filter(c=>c===card).length; }
function consAtk(h) { let n=0; for(let i=h.length-1;i>=0;i--){ if(h[i]===C.ATTACK)n++; else break; } return n; }
function prevDef(h) { return h.length>0 && h[h.length-1]===C.DEFENSE; }

function resolve(cardA, cardB, hA, hB) {
  let dA=0, dB=0, lines=[];
  // A on B
  if(cardA===C.ATTACK) {
    if(cardB!==C.DEFENSE && cardB!==C.COUNTER) { let x=consAtk(hA)+1; dB=x; lines.push(`A Attack (×${x}) → B takes ${x}`); }
    else lines.push(`A Attack blocked by B's ${CN[cardB]} → B takes 0`);
  } else if(cardA===C.DEFENSE) {
    if(cardB===C.HEAVY) {
      if(prevDef(hA)) lines.push('A consecutive Defense blocks Heavy Strike → A takes 0');
      else lines.push('A Defense fails vs Heavy Strike → A takes 1');
    } else lines.push(`A Defense vs ${CN[cardB]} → A takes 0`);
  } else if(cardA===C.HEAVY) {
    if(cardB===C.DEFENSE && prevDef(hB)) lines.push('A Heavy Strike blocked by B consecutive Defense → B takes 0');
    else { dB=1; lines.push('A Heavy Strike → B takes 1'); }
  } else if(cardA===C.COUNTER) {
    if(cardB===C.ATTACK) { dB=1; lines.push('A Counter vs B Attack → B takes 1, A takes 0'); }
    else if(cardB===C.HEAVY) { dB=1; lines.push('A Counter vs B Heavy Strike → both take 1'); }
    else lines.push(`A Counter vs ${CN[cardB]} → no effect`);
  }
  // B on A
  if(cardB===C.ATTACK) {
    if(cardA!==C.DEFENSE && cardA!==C.COUNTER) { let x=consAtk(hB)+1; dA+=x; lines.push(`B Attack (×${x}) → A takes ${x}`); }
    else lines.push(`B Attack blocked by A's ${CN[cardA]} → A takes 0`);
  } else if(cardB===C.DEFENSE) {
    if(cardA===C.HEAVY) {
      if(prevDef(hB)) lines.push('B consecutive Defense blocks Heavy Strike → B takes 0');
      else lines.push('B Defense fails vs Heavy Strike → B takes 1');
    } else lines.push(`B Defense vs ${CN[cardA]} → B takes 0`);
  } else if(cardB===C.HEAVY) {
    if(cardA===C.DEFENSE && prevDef(hA)) lines.push('B Heavy Strike blocked by A consecutive Defense → A takes 0');
    else { dA+=1; lines.push('B Heavy Strike → A takes 1'); }
  } else if(cardB===C.COUNTER) {
    if(cardA===C.ATTACK) { dA+=1; lines.push('B Counter vs A Attack → A takes 1, B takes 0'); }
    else if(cardA===C.HEAVY) { dA+=1; lines.push('B Counter vs A Heavy Strike → both take 1'); }
    else lines.push(`B Counter vs ${CN[cardA]} → no effect`);
  }
  return { dA, dB, lines };
}

function removeFromHand(hand, card) {
  let i=hand.indexOf(card); if(i!==-1) hand.splice(i,1);
}

function selectCard(card) {
  if(G.phase!=='select'||G.gameOver) return;
  let p=G.players[G.currentPlayer];
  if(countInHand(p.hand, card)===0) return;
  G.selection=card;
  if(G.opponentSelection!==null) {
    executeAndReveal();
  } else {
    G.phase='pass';
  }
  render();
}

function passToOpponent() {
  if(G.phase!=='pass') return;
  let opp = G.currentPlayer==='A'?'B':'A';
  G.opponentSelection = G.selection;
  G.selection = null;
  G.currentPlayer = opp;
  G.phase = 'select';
  render();
}

function executeAndReveal() {
  let pA=G.players.A, pB=G.players.B;
  let cardA, cardB;
  if(G.currentPlayer==='A') { cardA=G.selection; cardB=G.opponentSelection; }
  else { cardA=G.opponentSelection; cardB=G.selection; }

  let {dA,dB,lines}=resolve(cardA,cardB,pA.history,pB.history);
  pA.hp=Math.max(0,pA.hp-dA); pB.hp=Math.max(0,pB.hp-dB);

  removeFromHand(pA.hand, cardA);
  removeFromHand(pB.hand, cardB);

  pA.history.push(cardA); pB.history.push(cardB);

  G.lastResult={round:G.round,cardA,cardB,dA,dB,hpA:pA.hp,hpB:pB.hp,lines};
  G.logs.push(G.lastResult);
  G.selection=null; G.opponentSelection=null;
  G.phase='reveal';

  // Check game end
  let both0=pA.hp===0&&pB.hp===0, one0=(pA.hp===0||pB.hp===0)&&!both0;
  if(both0){ G.gameOver=true; G.winner='draw'; G.phase='gameover'; }
  else if(one0){ G.gameOver=true; G.winner=pA.hp>0?'A':'B'; G.phase='gameover'; }
  else if(G.round>=G.maxRounds){
    G.gameOver=true;
    G.winner=pA.hp>pB.hp?'A':pB.hp>pA.hp?'B':'draw';
    G.phase='gameover';
  }
  render();
}

function nextRound() {
  G.round++; G.currentPlayer='A'; G.selection=null; G.opponentSelection=null;
  G.lastResult=null; G.phase='select';
  render();
}

function resetGame() { G=fresh(); render(); }

// ---- RENDER ----
function render() {
  renderBanner();
  renderStatus();
  renderHand();
  renderAction();
  renderLog();
}

function renderBanner() {
  let el=document.getElementById('gameOverBanner');
  if(G.phase==='gameover') {
    if(G.winner==='draw') el.innerHTML=`<div class="game-over-banner banner-draw">🤝 Draw!<div class="banner-sub">Both players end with equal HP</div></div>`;
    else el.innerHTML=`<div class="game-over-banner banner-win">🏆 Player ${G.winner} Wins!<div class="banner-sub">Opponent HP reached 0 or ${G.winner} has higher HP after ${G.maxRounds} rounds</div></div>`;
  } else el.innerHTML='';
}

function renderStatus() {
  let el=document.getElementById('statusBar');
  el.innerHTML=['A','B'].map(pid=>{
    let p=G.players[pid];
    let cls='status-player';
    if(!G.gameOver&&G.phase==='select'&&G.currentPlayer===pid) cls+=' current';
    if(G.gameOver&&G.winner===pid) cls+=' winner';
    if(G.gameOver&&G.winner!=='draw'&&G.winner!==pid) cls+=' loser';
    let hearts='❤️'.repeat(p.hp)+'🖤'.repeat(Math.max(0,3-p.hp));
    let chips=p.history.map(c=>`<span class="hist-chip chip-${c}">${CI[c]}</span>`).join('');
    return `<div class="${cls}">
      <div class="status-name">Player ${pid}</div>
      <div class="status-hp"><span class="hearts">${hearts}</span> <strong>${p.hp}/3</strong></div>
      ${chips?`<div class="status-history">${chips}</div>`:''}
    </div>`;
  }).join('');
}

function renderHand() {
  let el=document.getElementById('handSection');
  if(G.phase==='gameover') { el.innerHTML=''; return; }

  let cur=G.currentPlayer, opp=cur==='A'?'B':'A';
  let pHand=G.players[cur];
  let pOpp=G.players[opp];

  // Current player hand
  let btns='';
  if(G.phase==='select') {
    btns=ORDER.map(card=>{
      let cnt=countInHand(pHand.hand,card);
      let sel=G.selection===card;
      let disabled=cnt===0||(G.selection&&!sel);
      return `<button class="card-btn card-${card}${sel?' selected':''}" ${disabled?'disabled':''} onclick="selectCard('${card}')">
        <span class="icon">${CI[card]}</span><span>${CN[card]}</span><span class="count">×${cnt}</span>
      </button>`;
    }).join('');
  } else {
    // Show the selected card (non-interactive) during pass/reveal
    let selCard=G.phase==='pass'?G.selection:(G.currentPlayer==='A'?G.selection:G.opponentSelection);
    if(selCard) {
      btns=`<div class="card-btn card-${selCard}" style="opacity:0.8;cursor:default">
        <span class="icon">${CI[selCard]}</span><span>${CN[selCard]}</span><span class="count">✓</span>
      </div>`;
    }
  }

  // Opponent hand (hidden)
  let oppCards='';
  let oppTotal=pOpp.hand.length;
  for(let i=0;i<oppTotal;i++) {
    oppCards+=`<div class="opp-card-back">🂠</div>`;
  }

  el.innerHTML=`
    <div class="hand-area">
      <div class="hand-title">🎯 Your Hand — Player ${cur} (${pHand.hand.length} cards)</div>
      <div class="card-grid">${btns}</div>
    </div>
    <div class="opp-hand-area">
      <div class="opp-hand-title">Player ${opp}'s Hand (${oppTotal} cards)</div>
      <div class="opp-card-grid">${oppCards||'<span style="color:var(--muted)">No cards left</span>'}</div>
    </div>`;
}

function renderAction() {
  let el=document.getElementById('actionSection');

  if(G.phase==='select') {
    let cur=G.currentPlayer;
    el.innerHTML=`
      <div style="text-align:center;padding:8px 0;color:var(--muted);font-size:0.9rem">
        Round ${G.round}/${G.maxRounds} — <span style="color:var(--gold);font-weight:700">Player ${cur}'s Turn</span> — Select a card
      </div>`;
  }
  else if(G.phase==='pass') {
    let cur=G.currentPlayer, opp=cur==='A'?'B':'A';
    el.innerHTML=`
      <div class="pass-screen">
        <div class="pass-text">✅ Player ${cur} has selected a card.</div>
        <div style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">Pass the device to <strong>Player ${opp}</strong></div>
        <button class="btn btn-primary btn-big" onclick="passToOpponent()">👤 I'm Player ${opp}</button>
        <div class="pass-hint">Player ${cur}'s selection is hidden until both players have chosen.</div>
      </div>`;
  }
  else if(G.phase==='reveal'||G.phase==='gameover') {
    let r=G.lastResult;
    if(!r) { el.innerHTML=''; return; }
    let lines=r.lines.map(l=>{
      let cls=l.includes('takes 0')?'res-safe':'res-dmg';
      return `<div class="${cls}">${l}</div>`;
    }).join('');

    el.innerHTML=`
      <div class="result-panel">
        <div class="result-title">⚡ Round ${r.round} Result</div>
        <div class="result-cards">
          <div class="result-card card-${r.cardA}">
            <span class="icon" style="font-size:2rem">${CI[r.cardA]}</span><span>A</span>
          </div>
          <div class="result-vs">VS</div>
          <div class="result-card card-${r.cardB}">
            <span class="icon" style="font-size:2rem">${CI[r.cardB]}</span><span>B</span>
          </div>
        </div>
        <div class="result-details">${lines}</div>
        <div class="res-hp">After: A <strong>${r.hpA} HP</strong> | B <strong>${r.hpB} HP</strong></div>
        ${G.phase==='reveal'?`<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary btn-big" onclick="nextRound()">▶ Next Round</button></div>`:`<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary btn-big" onclick="resetGame()">🔄 New Game</button></div>`}
      </div>`;
  }
}

function renderLog() {
  let el=document.getElementById('logContent');
  let entries=[...G.logs].reverse();
  let html=entries.map(e=>{
    let lines=e.lines.map(l=>{
      let cls=l.includes('takes 0')?'log-safe':'log-dmg';
      return `<span class="${cls}">${l}</span>`;
    }).join('<br>&nbsp;&nbsp;');
    return `<div class="log-entry"><strong>R${e.round}:</strong> A ${CI[e.cardA]} vs B ${CI[e.cardB]}<br>&nbsp;&nbsp;${lines}<br>&nbsp;&nbsp;<span style="color:var(--muted)">→ A ${e.hpA}HP | B ${e.hpB}HP</span></div>`;
  }).join('');
  el.innerHTML=html||'<span style="color:var(--muted)">Game started. Each player has 3 HP and 7 cards.</span>';
}

resetGame();
</script>
</body>
</html>
