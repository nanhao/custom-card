<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Card Game — Human vs AI Prototype</title>
<style>
  :root {
    --bg: #1a1a2e; --panel: #16213e; --accent: #e94560; --gold: #f5c518;
    --text: #eee; --muted: #8899aa;
    --attack: #e94560; --defense: #4e9af1; --heavy: #f39c12; --counter: #9b59b6; --green: #2ecc71;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px;
  }

  /* ---- Title ---- */
  h1 { font-size:1.5rem; color:var(--gold); margin-bottom:4px; text-align:center; }
  .subtitle { color:var(--muted); font-size:0.8rem; margin-bottom:12px; text-align:center; }

  /* ---- Screen switching ---- */
  .screen { display:none; flex-direction:column; align-items:center; width:100%; }
  .screen.active { display:flex; }

  /* ---- Main Menu ---- */
  .menu-container {
    background:var(--panel); border-radius:16px; padding:40px 32px;
    max-width:480px; width:100%; text-align:center; margin-top:24px;
    border:2px solid #2a2a5a;
  }
  .menu-container h2 { font-size:1.1rem; color:var(--text); margin-bottom:24px; }
  .menu-btn {
    display:block; width:100%; padding:18px 24px; margin-bottom:14px;
    border-radius:12px; border:2px solid transparent; cursor:pointer;
    font-size:1.05rem; font-weight:700; transition:all 0.2s;
  }
  .menu-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  .menu-btn.pvp { background:var(--panel); border-color:var(--gold); color:var(--gold); }
  .menu-btn.pvp:hover { background:#1e2a4a; }
  .menu-btn.ai { background:var(--gold); color:#1a1a2e; }
  .menu-btn.ai:hover { background:#e0b010; }
  .menu-desc { font-size:0.8rem; color:var(--muted); margin-top:-8px; margin-bottom:14px; }

  /* ---- Game Over Banner ---- */
  .game-over-banner {
    width:100%; max-width:700px; padding:16px 24px; border-radius:10px;
    text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:12px;
  }
  .banner-win { background:var(--green); color:#fff; }
  .banner-lose { background:var(--accent); color:#fff; }
  .banner-draw { background:var(--gold); color:#1a1a2e; }
  .banner-sub { font-size:0.9rem; font-weight:400; margin-top:4px; }

  /* ---- Status Bar ---- */
  .status-bar {
    width:100%; max-width:700px; display:flex; gap:16px; margin-bottom:12px;
  }
  .status-player {
    flex:1; background:var(--panel); border-radius:10px; padding:12px 16px;
    border:2px solid transparent; transition:border-color 0.3s;
  }
  .status-player.current { border-color:var(--gold); }
  .status-player.winner { border-color:var(--green); }
  .status-player.loser { border-color:var(--accent); opacity:0.6; }
  .status-name { font-size:0.9rem; font-weight:700; margin-bottom:4px; }
  .status-hp { font-size:1.1rem; }
  .status-hp .hearts { letter-spacing:2px; }

  /* ---- History chips ---- */
  .status-history { margin-top:6px; display:flex; gap:3px; flex-wrap:wrap; }
  .hist-chip {
    font-size:0.65rem; padding:2px 6px; border-radius:8px; font-weight:600;
  }
  .chip-attack { background:var(--attack); color:#fff; }
  .chip-defense { background:var(--defense); color:#fff; }
  .chip-heavy { background:var(--heavy); color:#1a1a2e; }
  .chip-counter { background:var(--counter); color:#fff; }

  /* ---- AI Badge ---- */
  .ai-badge {
    display:inline-block; font-size:0.65rem; padding:1px 8px; border-radius:6px;
    background:var(--counter); color:#fff; margin-left:4px; vertical-align:middle;
  }

  /* ---- Hand Area ---- */
  .hand-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:10px;
    padding:16px; margin-bottom:12px;
  }
  .hand-title { font-size:0.85rem; font-weight:700; color:var(--gold); margin-bottom:10px; text-align:center; }
  .card-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .card-btn {
    width:80px; height:110px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; font-weight:700; font-size:0.85rem; transition:all 0.2s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .card-btn:hover:not(:disabled) { transform:translateY(-4px); box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  .card-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .card-btn .icon { font-size:1.8rem; }
  .card-btn .count { font-size:0.7rem; color:rgba(255,255,255,0.6); }
  .card-attack { background:var(--attack); color:#fff; }
  .card-defense { background:var(--defense); color:#fff; }
  .card-heavy { background:var(--heavy); color:#1a1a2e; }
  .card-counter { background:var(--counter); color:#fff; }

  /* ---- Opponent Hand (Hidden) ---- */
  .opp-hand-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:10px;
    padding:16px; margin-bottom:12px; opacity:0.5;
  }
  .opp-hand-title { font-size:0.8rem; color:var(--muted); text-align:center; margin-bottom:8px; }
  .opp-card-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .opp-card-back {
    width:80px; height:110px; border-radius:10px; background:#2c3e50;
    display:flex; align-items:center; justify-content:center; font-size:2rem;
    border:2px dashed #444;
  }

  /* ---- Result Panel ---- */
  .result-panel {
    width:100%; max-width:700px; background:var(--panel); border-radius:12px;
    padding:20px; margin-bottom:12px; border:2px solid var(--gold);
  }
  .result-title { text-align:center; font-size:1rem; color:var(--gold); margin-bottom:12px; }
  .result-cards { display:flex; gap:24px; justify-content:center; align-items:center; margin-bottom:12px; }
  .result-card {
    width:90px; height:120px; border-radius:10px; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    font-weight:700; font-size:0.9rem;
  }
  .result-vs { font-size:1.3rem; color:var(--gold); font-weight:700; }
  .result-details { font-size:0.85rem; text-align:center; line-height:1.6; margin-bottom:12px; }
  .res-dmg { color:var(--accent); font-weight:700; }
  .res-safe { color:var(--green); }
  .res-hp { color:var(--muted); font-size:0.8rem; margin-top:4px; }
  .res-ai-pick {
    text-align:center; font-size:0.8rem; color:var(--muted); margin-bottom:10px;
  }

  /* ---- Buttons ---- */
  .btn-row { margin-bottom:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn {
    padding:10px 28px; border-radius:8px; border:none; cursor:pointer;
    font-weight:700; font-size:0.9rem; transition:all 0.2s;
  }
  .btn-primary { background:var(--gold); color:#1a1a2e; }
  .btn-primary:hover { background:#e0b010; }
  .btn-secondary { background:#334; color:var(--text); }
  .btn-secondary:hover { background:#445; }
  .btn-big { padding:14px 40px; font-size:1.05rem; }

  /* ---- Round Info ---- */
  .round-info {
    text-align:center; padding:8px 0; color:var(--muted); font-size:0.9rem;
  }
  .round-info .highlight { color:var(--gold); font-weight:700; }

  /* ---- AI Thinking ---- */
  .ai-thinking {
    width:100%; max-width:700px; background:var(--panel); border-radius:12px;
    padding:24px; text-align:center; margin-bottom:12px; border:2px solid var(--gold);
  }
  .ai-thinking .spinner {
    display:inline-block; width:32px; height:32px; border:3px solid var(--muted);
    border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;
    margin-bottom:12px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---- Round Log ---- */
  .log-area {
    width:100%; max-width:700px; background:var(--panel); border-radius:8px;
    padding:10px 16px; max-height:180px; overflow-y:auto;
  }
  .log-area h3 { font-size:0.8rem; color:var(--muted); margin-bottom:6px; }
  .log-entry { font-size:0.8rem; padding:3px 0; border-bottom:1px solid #2a2a4a; }
  .log-entry:last-child { border-bottom:none; }
  .log-dmg { color:var(--accent); }
  .log-safe { color:var(--green); }
</style>
</head>
<body>

<!-- ================================================================ -->
<!-- SCREEN 1: Main Menu                                                -->
<!-- ================================================================ -->
<div id="screenMenu" class="screen active">
  <h1>⚔️ Custom Card Game</h1>
  <div class="menu-container">
    <h2>Choose Game Mode</h2>
    <button class="menu-btn pvp" onclick="startHotseat()">
      👥 Hot-seat PVP
    </button>
    <div class="menu-desc">Two players on the same device, pass between rounds</div>
    <button class="menu-btn ai" onclick="showAISelect()">
      🤖 vs AI
    </button>
    <div class="menu-desc">Play against the computer — no second player needed</div>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCREEN 2: AI Selection                                              -->
<!-- ================================================================ -->
<div id="screenAISelect" class="screen">
  <h1>⚔️ Custom Card Game</h1>
  <div class="menu-container">
    <h2>Choose AI Opponent</h2>
    <div id="aiList"></div>
    <button class="btn btn-secondary" style="margin-top:20px;" onclick="goToMenu()">← Back to Menu</button>
  </div>
</div>

<!-- ================================================================ -->
<!-- SCREEN 3: Human vs AI Game                                         -->
<!-- ================================================================ -->
<div id="screenGame" class="screen">
  <h1>⚔️ Custom Card Game</h1>
  <div class="subtitle" id="gameSubtitle">🤖 vs AI — You are Player 1</div>

  <div id="gameOverBanner"></div>
  <div class="status-bar" id="statusBar"></div>
  <div id="handSection"></div>
  <div id="actionSection"></div>
  <div class="log-area"><h3>📜 Round Log</h3><div id="logContent"><span style="color:var(--muted)">Game started. Each player has 3 HP and 7 cards.</span></div></div>

  <div class="btn-row" style="margin-top:16px;">
    <button class="btn btn-secondary" onclick="goToMenu()">← Back to Menu</button>
  </div>
</div>

<script>
// =========================================================================
// Card constants
// =========================================================================
const C = { ATTACK:'attack', DEFENSE:'defense', HEAVY:'heavy', COUNTER:'counter' };
const CN = { attack:'Attack', defense:'Defense', heavy:'Heavy Strike', counter:'Counter' };
const CI = { attack:'⚔️', defense:'🛡️', heavy:'💥', counter:'↩️' };
const ORDER = [C.ATTACK, C.DEFENSE, C.HEAVY, C.COUNTER];

// =========================================================================
// Game state
// =========================================================================
let G = {};

function freshGame() {
  return {
    players: {
      human: { hp:3, hand:[C.ATTACK,C.ATTACK,C.ATTACK, C.DEFENSE,C.DEFENSE, C.HEAVY, C.COUNTER], history:[] },
      ai:    { hp:3, hand:[C.ATTACK,C.ATTACK,C.ATTACK, C.DEFENSE,C.DEFENSE, C.HEAVY, C.COUNTER], history:[] }
    },
    round:1, maxRounds:7,
    phase:'select', // select | thinking | reveal | gameover
    humanCard:null,
    aiCard:null,
    lastResult:null,
    winner:null,
    gameOver:false,
    logs:[]
  };
}

// =========================================================================
// Helpers
// =========================================================================
function countInHand(hand, card) { return hand.filter(c=>c===card).length; }
function consAtk(h) { let n=0; for(let i=h.length-1;i>=0;i--){ if(h[i]===C.ATTACK)n++; else break; } return n; }
function prevDef(h) { return h.length>0 && h[h.length-1]===C.DEFENSE; }

// =========================================================================
// Resolution (identical to hot-seat rules)
// =========================================================================
function resolve(cardHuman, cardAI, hHuman, hAI) {
  let dHuman=0, dAI=0, lines=[];
  // Human on AI
  if(cardHuman===C.ATTACK) {
    if(cardAI!==C.DEFENSE && cardAI!==C.COUNTER) { let x=consAtk(hHuman)+1; dAI=x; lines.push(`You Attack (×${x}) → AI takes ${x}`); }
    else lines.push(`You Attack blocked by AI's ${CN[cardAI]} → AI takes 0`);
  } else if(cardHuman===C.DEFENSE) {
    if(cardAI===C.HEAVY) {
      if(prevDef(hHuman)) lines.push('You consecutive Defense blocks Heavy Strike → You take 0');
      else lines.push('You Defense fails vs Heavy Strike → You take 1');
    } else lines.push(`You Defense vs ${CN[cardAI]} → You take 0`);
  } else if(cardHuman===C.HEAVY) {
    if(cardAI===C.DEFENSE && prevDef(hAI)) lines.push('Your Heavy Strike blocked by AI consecutive Defense → AI takes 0');
    else { dAI=1; lines.push('Your Heavy Strike → AI takes 1'); }
  } else if(cardHuman===C.COUNTER) {
    if(cardAI===C.ATTACK) { dAI=1; lines.push('You Counter vs AI Attack → AI takes 1, You take 0'); }
    else if(cardAI===C.HEAVY) { dAI=1; lines.push('You Counter vs AI Heavy Strike → both take 1'); }
    else lines.push(`You Counter vs ${CN[cardAI]} → no effect`);
  }
  // AI on Human
  if(cardAI===C.ATTACK) {
    if(cardHuman!==C.DEFENSE && cardHuman!==C.COUNTER) { let x=consAtk(hAI)+1; dHuman+=x; lines.push(`AI Attack (×${x}) → You take ${x}`); }
    else lines.push(`AI Attack blocked by your ${CN[cardHuman]} → You take 0`);
  } else if(cardAI===C.DEFENSE) {
    if(cardHuman===C.HEAVY) {
      if(prevDef(hAI)) lines.push('AI consecutive Defense blocks Heavy Strike → AI takes 0');
      else lines.push('AI Defense fails vs Heavy Strike → AI takes 1');
    } else lines.push(`AI Defense vs ${CN[cardHuman]} → AI takes 0`);
  } else if(cardAI===C.HEAVY) {
    if(cardHuman===C.DEFENSE && prevDef(hHuman)) lines.push('AI Heavy Strike blocked by your consecutive Defense → You take 0');
    else { dHuman+=1; lines.push('AI Heavy Strike → You take 1'); }
  } else if(cardAI===C.COUNTER) {
    if(cardHuman===C.ATTACK) { dHuman+=1; lines.push('AI Counter vs your Attack → You take 1, AI takes 0'); }
    else if(cardHuman===C.HEAVY) { dHuman+=1; lines.push('AI Counter vs your Heavy Strike → both take 1'); }
    else lines.push(`AI Counter vs ${CN[cardHuman]} → no effect`);
  }
  return { dHuman, dAI, lines };
}

function removeFromHand(hand, card) {
  let i=hand.indexOf(card); if(i!==-1) hand.splice(i,1);
}

// =========================================================================
// AI Registry (placeholder — in real app, loaded from backend)
// =========================================================================
const AI_LIST = [
  { name: 'rnn_v1.1', description: 'GRU-based model, random weights (gen1)' }
];

// =========================================================================
// AI Move (placeholder — picks first available card)
// =========================================================================
function aiPickCard() {
  let hand = G.players.ai.hand;
  // Simulate AI decision: pick the first card in hand.
  // In the real implementation, this calls the selected AI model.
  return hand.length > 0 ? hand[0] : null;
}

// =========================================================================
// Actions
// =========================================================================
function humanSelectCard(card) {
  if(G.phase!=='select'||G.gameOver) return;
  let p = G.players.human;
  if(countInHand(p.hand, card)===0) return;

  G.humanCard = card;
  G.phase = 'thinking';
  render();

  // Simulate AI thinking (brief delay for visual feedback)
  setTimeout(() => {
    G.aiCard = aiPickCard();
    executeAndReveal();
  }, 400);
}

function executeAndReveal() {
  let pHuman = G.players.human, pAI = G.players.ai;
  let {dHuman, dAI, lines} = resolve(G.humanCard, G.aiCard, pHuman.history, pAI.history);

  pHuman.hp = Math.max(0, pHuman.hp - dHuman);
  pAI.hp    = Math.max(0, pAI.hp - dAI);

  removeFromHand(pHuman.hand, G.humanCard);
  removeFromHand(pAI.hand, G.aiCard);
  pHuman.history.push(G.humanCard);
  pAI.history.push(G.aiCard);

  G.lastResult = { round:G.round, cardHuman:G.humanCard, cardAI:G.aiCard, dHuman, dAI, hpHuman:pHuman.hp, hpAI:pAI.hp, lines };
  G.logs.push(G.lastResult);

  // Check game end
  let both0 = pHuman.hp===0 && pAI.hp===0;
  let one0 = (pHuman.hp===0 || pAI.hp===0) && !both0;
  if(both0) { G.gameOver=true; G.winner='draw'; G.phase='gameover'; }
  else if(one0) { G.gameOver=true; G.winner=pAI.hp===0?'human':'ai'; G.phase='gameover'; }
  else if(G.round>=G.maxRounds) {
    G.gameOver=true;
    G.winner = pHuman.hp>pAI.hp?'human':pAI.hp>pHuman.hp?'ai':'draw';
    G.phase='gameover';
  } else {
    G.phase='reveal';
  }
  render();
}

function nextRound() {
  G.round++; G.humanCard=null; G.aiCard=null;
  G.lastResult=null; G.phase='select';
  render();
}

function newAIGame() {
  G = freshGame();
  render();
}

// =========================================================================
// Screen navigation
// =========================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startHotseat() {
  // In the real app, this navigates to the existing hot-seat interface.
  // For the prototype, show an alert.
  alert('Hot-seat PVP would load the existing game interface.');
}

function showAISelect() {
  renderAIList();
  showScreen('screenAISelect');
}

function startAI(aiName) {
  G = freshGame();
  G.aiName = aiName;
  document.getElementById('gameSubtitle').textContent =
    '🤖 vs ' + aiName + ' — You are Player 1';
  showScreen('screenGame');
  render();
}

function goToMenu() {
  showScreen('screenMenu');
}

function renderAIList() {
  let el = document.getElementById('aiList');
  if(AI_LIST.length === 0) {
    el.innerHTML = '<p style="color:var(--muted)">No AI opponents available.</p>';
    return;
  }
  el.innerHTML = AI_LIST.map(ai => `
    <button class="menu-btn ai" onclick="startAI('${ai.name}')">
      🤖 ${ai.name}
    </button>
    <div class="menu-desc">${ai.description}</div>
  `).join('');
}

// =========================================================================
// Render
// =========================================================================
function render() {
  renderBanner();
  renderStatus();
  renderHand();
  renderAction();
  renderLog();
}

function renderBanner() {
  let el = document.getElementById('gameOverBanner');
  if(G.phase==='gameover') {
    if(G.winner==='draw') {
      el.innerHTML=`<div class="game-over-banner banner-draw">🤝 Draw!<div class="banner-sub">Both sides end with equal HP</div></div>`;
    } else if(G.winner==='human') {
      el.innerHTML=`<div class="game-over-banner banner-win">🏆 You Win!<div class="banner-sub">AI's HP reached 0 or you lead after 7 rounds</div></div>`;
    } else {
      el.innerHTML=`<div class="game-over-banner banner-lose">💀 AI Wins<div class="banner-sub">Your HP reached 0 or AI leads after 7 rounds</div></div>`;
    }
  } else {
    el.innerHTML='';
  }
}

function renderStatus() {
  let el = document.getElementById('statusBar');
  let pYou = G.players.human, pAI = G.players.ai;

  let youCls = 'status-player';
  let aiCls = 'status-player';
  if(!G.gameOver && G.phase==='select') youCls += ' current';
  if(G.gameOver) {
    if(G.winner==='human') youCls += ' winner';
    else if(G.winner==='ai') aiCls += ' winner';
  }
  if(G.gameOver && G.winner==='ai') youCls += ' loser';

  let youHearts = '❤️'.repeat(pYou.hp)+'🖤'.repeat(Math.max(0,3-pYou.hp));
  let aiHearts = '❤️'.repeat(pAI.hp)+'🖤'.repeat(Math.max(0,3-pAI.hp));

  let youChips = pYou.history.map(c=>`<span class="hist-chip chip-${c}">${CI[c]}</span>`).join('');
  let aiChips = pAI.history.map(c=>`<span class="hist-chip chip-${c}">${CI[c]}</span>`).join('');

  el.innerHTML = `
    <div class="${youCls}">
      <div class="status-name">You (Player 1)</div>
      <div class="status-hp"><span class="hearts">${youHearts}</span> <strong>${pYou.hp}/3</strong></div>
      ${youChips?`<div class="status-history">${youChips}</div>`:''}
    </div>
    <div class="${aiCls}">
      <div class="status-name">AI<span class="ai-badge">🤖</span></div>
      <div class="status-hp"><span class="hearts">${aiHearts}</span> <strong>${pAI.hp}/3</strong></div>
      ${aiChips?`<div class="status-history">${aiChips}</div>`:''}
    </div>`;
}

function renderHand() {
  let el = document.getElementById('handSection');
  if(G.phase==='gameover') { el.innerHTML=''; return; }

  let pYou = G.players.human, pAI = G.players.ai;

  // Your hand
  let btns = '';
  if(G.phase==='select') {
    btns = ORDER.map(card=>{
      let cnt = countInHand(pYou.hand, card);
      return `<button class="card-btn card-${card}" ${cnt===0?'disabled':''} onclick="humanSelectCard('${card}')">
        <span class="icon">${CI[card]}</span><span>${CN[card]}</span><span class="count">×${cnt}</span>
      </button>`;
    }).join('');
  } else {
    // Show selected card (non-interactive) during thinking/reveal
    if(G.humanCard) {
      btns = `<div class="card-btn card-${G.humanCard}" style="opacity:0.8;cursor:default">
        <span class="icon">${CI[G.humanCard]}</span><span>${CN[G.humanCard]}</span><span class="count">✓</span>
      </div>`;
    }
  }

  // AI hand (hidden)
  let oppCards = '';
  for(let i=0;i<pAI.hand.length;i++) {
    oppCards += `<div class="opp-card-back">🂠</div>`;
  }

  el.innerHTML = `
    <div class="hand-area">
      <div class="hand-title">🎯 Your Hand (${pYou.hand.length} cards)</div>
      <div class="card-grid">${btns}</div>
    </div>
    <div class="opp-hand-area">
      <div class="opp-hand-title">🤖 AI's Hand (${pAI.hand.length} cards)</div>
      <div class="opp-card-grid">${oppCards||'<span style="color:var(--muted)">No cards left</span>'}</div>
    </div>`;
}

function renderAction() {
  let el = document.getElementById('actionSection');

  if(G.phase==='select') {
    el.innerHTML = `
      <div class="round-info">
        Round ${G.round}/${G.maxRounds} — <span class="highlight">Your Turn</span> — Select a card
      </div>`;
  }
  else if(G.phase==='thinking') {
    el.innerHTML = `
      <div class="ai-thinking">
        <div class="spinner"></div>
        <div>AI is choosing a card…</div>
      </div>`;
  }
  else if(G.phase==='reveal'||G.phase==='gameover') {
    let r = G.lastResult;
    if(!r) { el.innerHTML=''; return; }
    let lines = r.lines.map(l=>{
      let cls = l.includes('takes 0')?'res-safe':'res-dmg';
      return `<div class="${cls}">${l}</div>`;
    }).join('');
    el.innerHTML = `
      <div class="result-panel">
        <div class="result-title">⚡ Round ${r.round} Result</div>
        <div class="res-ai-pick">AI chose <strong>${CN[r.cardAI]} ${CI[r.cardAI]}</strong></div>
        <div class="result-cards">
          <div class="result-card card-${r.cardHuman}">
            <span class="icon" style="font-size:2rem">${CI[r.cardHuman]}</span><span>You</span>
          </div>
          <div class="result-vs">VS</div>
          <div class="result-card card-${r.cardAI}">
            <span class="icon" style="font-size:2rem">${CI[r.cardAI]}</span><span>AI</span>
          </div>
        </div>
        <div class="result-details">${lines}</div>
        <div class="res-hp">After: You <strong>${r.hpHuman} HP</strong> | AI <strong>${r.hpAI} HP</strong></div>
        ${G.phase==='reveal'?`
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-primary btn-big" onclick="nextRound()">▶ Next Round</button>
          </div>`:`
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-primary btn-big" onclick="newAIGame()">🔄 New Game</button>
          </div>`}
      </div>`;
  }
}

function renderLog() {
  let el = document.getElementById('logContent');
  let entries = [...G.logs].reverse();
  let html = entries.map(e=>{
    let lines = e.lines.map(l=>{
      let cls = l.includes('takes 0')?'log-safe':'log-dmg';
      return `<span class="${cls}">${l}</span>`;
    }).join('<br>&nbsp;&nbsp;');
    return `<div class="log-entry"><strong>R${e.round}:</strong> You ${CI[e.cardHuman]} vs AI ${CI[e.cardAI]}<br>&nbsp;&nbsp;${lines}<br>&nbsp;&nbsp;<span style="color:var(--muted)">→ You ${e.hpHuman}HP | AI ${e.hpAI}HP</span></div>`;
  }).join('');
  el.innerHTML = html || '<span style="color:var(--muted)">Game started. Each player has 3 HP and 7 cards.</span>';
}

</script>
</body>
</html>
